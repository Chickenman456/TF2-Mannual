name: Deploy standalone web version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out standalone site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy standalone site
        id: deployment
        uses: actions/deploy-pages@v4
